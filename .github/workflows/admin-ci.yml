name: admin-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Angular CLI 22 requires Node >=22.22.3 or >=24.15.0 — pin 24.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use npm 12 (declared toolchain)
        run: npm install -g npm@12.0.2

      # package.json pins every dependency to an exact version and is the source of
      # truth in CI exactly as it is locally, so `npm install` rather than `npm ci`.
      # `npm ci` would also hard-fail on any lockfile/package.json drift, which we
      # want reconciled rather than fatal.
      - name: Install dependencies
        run: npm install

      # Tests run before the build: they are far faster, so a regression
      # surfaces sooner than it would behind a full production bundle.
      - name: Unit tests
        run: npm test

      # No lint script exists in this repo yet — the gate is the unit tests
      # plus the production build (the same command that emits the deploy
      # artifact).
      - name: Build (production)
        run: npm run build
